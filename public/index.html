<body>
    <div class="container">
        <header>
            <h1>UAV Ground Control Station</h1>
            <div class="status" id="status">Disconnected</div>
        </header>

        <main>
            <div class="map-container">
                <div id="map"></div>
            </div>

            <div class="control-panel">
                <div class="telemetry-panel" id="telemetry-panel">
                    <h3>Telemetry</h3>
                    <!-- Telemetry data will be populated by JavaScript -->
                </div>

                <div class="control-buttons">
                    <button id="connect-btn">Connect</button>
                    <button id="arm-btn">Arm</button>
                    <button id="takeoff-btn">Takeoff</button>
                    <button id="land-btn">Land</button>
                    <button id="emergency-stop-btn">Emergency Stop</button>
                    <button id="mission-btn">Load Mission</button>
                </div>

                <div class="flight-controls">
                    <h3>Flight Controls</h3>
                    <div class="control-slider">
                        <label for="throttle">Throttle</label>
                        <input type="range" id="throttle" min="0" max="100" value="0">
                    </div>
                    <div class="control-slider">
                        <label for="yaw">Yaw</label>
                        <input type="range" id="yaw" min="-100" max="100" value="0">
                    </div>
                    <div class="control-slider">
                        <label for="pitch">Pitch</label>
                        <input type="range" id="pitch" min="-100" max="100" value="0">
                    </div>
                    <div class="control-slider">
                        <label for="roll">Roll</label>
                        <input type="range" id="roll" min="-100" max="100" value="0">
                    </div>
                </div>

                <div class="camera-controls">
                    <h3>Camera Controls</h3>
                    <button id="camera-up">Up</button>
                    <button id="camera-down">Down</button>
                    <button id="camera-left">Left</button>
                    <button id="camera-right">Right</button>
                </div>

                <div class="flight-mode">
                    <h3>Flight Mode</h3>
                    <select id="flight-mode-select">
                        <option value="stabilize">Stabilize</option>
                        <option value="alt_hold">Altitude Hold</option>
                        <option value="loiter">Loiter</option>
                        <option value="auto">Auto</option>
                        <option value="guided">Guided</option>
                    </select>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
